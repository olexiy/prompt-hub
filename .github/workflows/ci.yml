# Pull-request checks. Rules (docs/DEV_PROCESS.md §4, docs/research/architecture.md §6):
# runs on PRs and manual dispatch only, never on push to main; docs-only PRs skip code jobs;
# actions pinned to commit SHAs; no pull_request_target; read-only token unless a job needs more.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - "apps/**"
              - "packages/**"
              - "e2e/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - "eslint.config.js"
              - ".prettier*"
              - ".github/**"

  checks:
    # One job for everything that needs the local Supabase stack, so it starts only once.
    name: Lint, types, tests, build, e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Google Chrome is preinstalled on the runner; no Playwright browser download.
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Migrations match the schema
        run: pnpm db:generate && git diff --exit-code -- packages/db/migrations
      - name: Start local Supabase (Postgres 17 + Auth, same config as development)
        run: pnpm exec supabase start -x studio,postgres-meta
      - name: Local Worker variables from the throwaway stack
        # Local-only keys of a stack that exists for this job; written to a file, never echoed.
        run: |
          eval "$(pnpm exec supabase status -o env 2>/dev/null)"
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nSUPABASE_SECRET_KEY=%s\n' \
            "$API_URL" "$PUBLISHABLE_KEY" "$SECRET_KEY" > apps/api/.dev.vars
      - run: pnpm db:migrate
      # Build first: the API tests load wrangler.jsonc, whose assets directory is the web build.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm e2e
      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm audit --prod --audit-level moderate

  osv:
    name: OSV-Scanner
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  result:
    # The one required status check on main: passes when every job passed or was skipped.
    name: CI result
    if: always()
    needs: [changes, checks, audit, osv, secrets]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed or were not needed."
