# CI pattern (from model-proving-ground). Copy to .github/workflows/ci.yml in the Phase 1 skeleton task
# and replace the example jobs with the project's real ones.
#
# Why it looks like this:
# - Runs on pull requests and manual dispatch only, not on push to main: a squash merge lands exactly
#   the code the PR already checked. Saves Actions minutes on private repos (2000/month free).
# - paths-filter runs each job only when its inputs changed; a docs-only PR runs no test jobs.
# - A manual run checks everything.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's changed files

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            # e2e starts the real backend, so backend sources count for the frontend job too.
            frontend:
              - 'frontend/**'
              - 'backend/src/**'
              - '.github/workflows/**'

  # Example: Java / Maven backend. Replace with the project's stack (uv + ruff + pytest, Gradle, ...).
  backend:
    name: Backend (build, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  # Example: Angular frontend with Playwright e2e.
  frontend:
    name: Frontend (format, unit, build, e2e)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
